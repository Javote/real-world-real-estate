# ─────────────────────────────────────────────────────────────────────────────
# Blueprint de Render — el único artefacto de infraestructura del proyecto.
#
# Runtime NATIVO de Node, sin imagen propia: D-041 mató los Dockerfiles al
# descubrir que Docker era un requisito de Railway (D-010) que sobrevivió al
# cambio de plataforma (D-039) sin que nadie lo examinara.
#
# TODO acá corre en free tier — $0/mes, y eso es restricción de arquitectura,
# no nota de presupuesto (D-040):
#   · 750 instance-hours/mes COMPARTIDAS entre los dos servicios.
#   · Spin-down a los 15 min de inactividad, ~1 min de arranque en frío.
#   · **Keep-warm está PROHIBIDO**: dos servicios despiertos 24/7 son ~1460 h
#     contra 750 y quedan suspendidos cerca del día 15. Se calienta la URL a
#     mano antes de una demo o grabación, y se la deja dormir el resto.
#   · Sin disco persistente, sin shell y sin one-off jobs: por eso las
#     migraciones van en el startCommand, la base es Turso y la evidencia vive
#     en Cloudflare R2 — nada que importe se guarda en el filesystem.
#
# Lo que NO está acá y hay que crear a mano una vez (ver specs/RUNBOOK-deploy.md):
#   · La base Turso y su token.
#   · El bucket de R2 y su par de claves S3 (§1.4).
#   · El seed de las cuentas demo (se corre desde tu máquina contra Turso: en
#     free tier no hay shell remota).
#
# ⚠ ORDEN: `STORAGE_DRIVER=s3` sin las S3_* hace que la API **no arranque**
# (D-042, `required()` en storage.ts). Las credenciales de R2 van al dashboard
# ANTES de que este archivo llegue a main.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: propnexus-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    # Declarado para que solo redeploye si cambió algo que la API compila.
    # ⚠ MEDIDO 2026-08-27: NO filtra. Un commit de solo `.md` reconstruyó los dos
    # servicios igual, con `trigger = new_commit`. Se deja declarado —es correcto
    # y está bien registrado del lado de Render— pero no cuentes con el ahorro.
    # RUNBOOK §2.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - packages/cardano/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - render.yaml
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @plataforma/shared build &&
      pnpm --filter @plataforma/cardano build &&
      pnpm --filter @plataforma/api build
    # Las migraciones corren ANTES de escuchar, en cada arranque. Son
    # idempotentes (tabla `_migrations`, D-049) y no hay alternativa: el free
    # tier no da shell ni one-off jobs (D-012 · D-040).
    startCommand: >-
      node apps/api/dist/src/db/migrate.js &&
      node apps/api/dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"                    # la misma que verifica el CI
      - key: JWT_SECRET
        generateValue: true            # D-042: sin fallback; si falta, el proceso no arranca
      # Turso (D-038 · D-040). `sync: false` = se carga a mano en el dashboard,
      # nunca en el repo (regla 12). Sale de `turso db show` / `turso db tokens create`.
      - key: DATABASE_URL
        sync: false                    # libsql://<base>-<org>.turso.io
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # D-045: con 0 detrás del proxy de Render todos los clientes comparten
      # balde de rate limit y la app queda inusable. Render pone 1 salto.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "20"
      # Ahora es SOLO staging de Multer: el archivo aterriza acá, `storage.put()`
      # lo sube a R2 y la ruta lo borra en el acto (`storage.driver === "s3"`).
      # Que el filesystem sea efímero dejó de importar — lo que persiste es el
      # objeto en R2, no esto.
      - key: UPLOAD_DIR
        value: /tmp/uploads
      - key: MAX_FILE_SIZE_MB
        value: "10"
      # ── Evidencia en Cloudflare R2 (D-011) ─────────────────────────────────
      # El MISMO driver que se prueba contra MinIO en local: cambian variables,
      # no el código (`apps/api/src/lib/storage.ts`). Con `s3` el SHA-256 se
      # calcula RELEYENDO el objeto subido, así que cubre los bytes que quedaron
      # guardados y no los del temporal — de eso cuelga la cadena de prueba.
      - key: STORAGE_DRIVER
        value: s3
      # `https://<ACCOUNT_ID>.r2.cloudflarestorage.com`. `sync: false` porque
      # lleva el ID de cuenta de Cloudflare adentro.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: propnexus-evidencia
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Las dos que siguen NO son redundantes: los defaults del código apuntan a
      # MinIO y R2 necesita lo contrario en las dos.
      #   · region: "When using the S3 API, the region for an R2 bucket is `auto`"
      #     — el default del código es us-east-1.
      #   · Cloudflare documenta virtual-hosted-style; path-style no está
      #     garantizado. El default del código es `true`, para MinIO.
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      # En R2 el bucket se crea a mano desde el dashboard (RUNBOOK §1.4). Que la
      # API no pueda crearlo es deliberado: sus credenciales son de objeto, no
      # de administración del bucket.
      - key: S3_CREATE_BUCKET
        value: "false"
      # D-013: Preprod SIEMPRE. Mainnet está fuera del alcance de M3.
      # `ANCHOR_MODE=simulated` es el único válido hoy: el adaptador real llega
      # en la rebanada B de SPEC-013 y pedirlo antes revienta al arrancar
      # (D-042 — sin defaults inseguros, y sin fallar recién en el primer
      # anclaje). `CARDANO_NETWORK` no lo lee nadie todavía; se deja declarado
      # para que el día del adaptador real no haya que tocar infraestructura.
      - key: CARDANO_NETWORK
        value: Preprod
      - key: ANCHOR_MODE
        value: simulated
      # Lista blanca de CORS (D-065). El web es estático y vive en otro origen;
      # sin esto el browser corta cada request con `Authorization`.
      # Mismo caso: la lista blanca compara contra el header `Origin`, que trae
      # esquema (`https://propnexus-web.onrender.com`). Acepta varios separados
      # por coma.
      - key: WEB_ORIGIN
        sync: false

  # ── Web (SPA estático) ─────────────────────────────────────────────────────
  # D-065: dejó de ser un servicio Node con SSR. Como static site no se duerme,
  # no consume del presupuesto de 750 horas —que ahora es todo de la API— y se
  # sirve desde CDN. El precio es que vive en otro origen: de ahí
  # `VITE_API_ORIGIN` acá y la lista blanca de CORS del otro lado.
  - type: web
    name: propnexus-web
    runtime: static
    branch: main
    rootDir: .
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - render.yaml
    buildCommand: >-
      corepack enable &&
      pnpm install --frozen-lockfile &&
      pnpm --filter @plataforma/shared build &&
      pnpm --filter @plataforma/web build
    staticPublishPath: apps/web/dist
    # SPA: cualquier path lo resuelve el router del cliente.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # De BUILD TIME: cambiarla exige redeploy del web, no un restart.
      # `sync: false` y no `fromService` porque hace falta la URL **con
      # esquema** (`https://propnexus-api.onrender.com`) y `fromService` solo
      # devuelve el host. Se pega a mano una vez, en el dashboard.
      - key: VITE_API_ORIGIN
        sync: false
