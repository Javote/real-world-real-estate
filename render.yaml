# ─────────────────────────────────────────────────────────────────────────────
# Blueprint de Render — el único artefacto de infraestructura del proyecto.
#
# Runtime NATIVO de Node, sin imagen propia: D-041 mató los Dockerfiles al
# descubrir que Docker era un requisito de Railway (D-010) que sobrevivió al
# cambio de plataforma (D-039) sin que nadie lo examinara.
#
# TODO acá corre en free tier — $0/mes, y eso es restricción de arquitectura,
# no nota de presupuesto (D-040):
#   · 750 instance-hours/mes COMPARTIDAS entre los dos servicios.
#   · Spin-down a los 15 min de inactividad, ~1 min de arranque en frío.
#   · **Keep-warm está PROHIBIDO**: dos servicios despiertos 24/7 son ~1460 h
#     contra 750 y quedan suspendidos cerca del día 15. Se calienta la URL a
#     mano antes de una demo o grabación, y se la deja dormir el resto.
#   · Sin disco persistente, sin shell y sin one-off jobs: por eso las
#     migraciones van en el startCommand, la base es Turso y la evidencia vive
#     en Cloudflare R2 — nada que importe se guarda en el filesystem.
#
# Lo que NO está acá y hay que crear a mano una vez (ver specs/evidencia-m3/5-ops/RUNBOOK-deploy.md):
#   · La base Turso y su token.
#   · El bucket de R2 y su par de claves S3 (§1.4).
#   · El seed de las cuentas demo (se corre desde tu máquina contra Turso: en
#     free tier no hay shell remota).
#
# ⚠ ORDEN: `STORAGE_DRIVER=s3` sin las S3_* hace que la API **no arranque**
# (D-042, `required()` en storage.ts). Las credenciales de R2 van al dashboard
# ANTES de que este archivo llegue a main.
# ─────────────────────────────────────────────────────────────────────────────

services:
  # ── API ────────────────────────────────────────────────────────────────────
  - type: web
    name: propnexus-api
    runtime: node
    plan: free
    region: oregon
    branch: main
    rootDir: .
    # Declarado para que solo redeploye si cambió algo que la API compila.
    # ⚠ MEDIDO 2026-08-27 y otra vez el 2026-09-04: NO filtra. Un commit de solo
    # `.md` reconstruye los dos servicios igual, con `trigger = new_commit`.
    # El 2026-09-04 se confirmó que el filtro SÍ llega a Render —leído de la API
    # con `render services --output json`, los dos servicios traen su
    # `buildFilter.paths` completo—, así que el problema no es que no se aplique
    # el blueprint: es que Render no lo respeta. Causa sin determinar.
    # **No es gratis**: ese día un commit de solo documentación (`ef8e55e`)
    # disparó el redeploy que dejó la API caída ~18 minutos. RUNBOOK §2.
    buildFilter:
      paths:
        - apps/api/**
        - packages/shared/**
        - packages/cardano/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - render.yaml
    # `NODE_ENV=development` INLINE, solo en el `install`: sacar `NODE_ENV` de
    # `envVars` (commit anterior) no alcanzó — Render lo sigue mandando
    # `production` en el entorno del build igual (probablemente un valor que
    # quedó sincronizado en el dashboard de una corrida vieja y no se retira
    # solo al borrar la declaración del Blueprint). En vez de depender de que
    # Render lo saque, el comando queda inmune a lo que sea que el entorno
    # traiga: fuerza `development` para el único paso que le importa
    # (`pnpm install`, que con `NODE_ENV=production` saltea devDependencies —
    # `@types/node` incluido, y `packages/cardano` no compila sin eso).
    buildCommand: >-
      corepack enable &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @plataforma/shared build &&
      pnpm --filter @plataforma/cardano build &&
      pnpm --filter @plataforma/api build
    # Las migraciones corren ANTES de escuchar, en cada arranque. Son
    # idempotentes (tabla `_migrations`, D-049) y no hay alternativa: el free
    # tier no da shell ni one-off jobs (D-012 · D-040).
    #
    # `--require .../instrumentation.js` en el segundo comando, no en el
    # primero: Sentry/OTel instrumentan Express y el driver de la base, y
    # `migrate.js` no usa ninguno de los dos. Tiene que ser el módulo que el
    # proceso carga PRIMERO — antes de `server.js`, que es el que hace
    # `require` de Express — para que las auto-instrumentaciones alcancen a
    # parchear los módulos antes de que algo los cargue sin parche.
    #
    # `NODE_ENV=production` va INLINE acá, no como env var del servicio.
    # Declararla como env var la aplica también al `buildCommand` — probado:
    # rompió el build entero, porque con esa variable puesta `pnpm install`
    # saltea las devDependencies (`@types/node` incluido) y
    # `packages/cardano` no compila (TS2688). Inline, solo la ve este proceso.
    startCommand: >-
      node apps/api/dist/src/db/migrate.js &&
      NODE_ENV=production node --require ./apps/api/dist/src/instrumentation.js apps/api/dist/src/server.js
    healthCheckPath: /health
    envVars:
      - key: NODE_VERSION
        value: "22"                    # la misma que verifica el CI
      - key: JWT_SECRET
        generateValue: true            # D-042: sin fallback; si falta, el proceso no arranca
      # Turso (D-038 · D-040). `sync: false` = se carga a mano en el dashboard,
      # nunca en el repo (regla 12). Sale de `turso db show` / `turso db tokens create`.
      - key: DATABASE_URL
        sync: false                    # libsql://<base>-<org>.turso.io
      - key: DATABASE_AUTH_TOKEN
        sync: false
      # D-045: con 0 detrás del proxy de Render todos los clientes comparten
      # balde de rate limit y la app queda inusable. Render pone 1 salto.
      - key: TRUST_PROXY_HOPS
        value: "1"
      - key: LOGIN_RATE_LIMIT_MAX
        value: "20"
      # SPEC-211 (B-11): la otra ruta sin sesión (GET /public/dossier/:shareToken)
      # también corre detrás de un limiter. Más laxo que el del login: acá el
      # caso legítimo es un escribano reabriendo el link, no un intento de
      # adivinar una credencial.
      - key: DOSSIER_RATE_LIMIT_MAX
        value: "60"
      # Ahora es SOLO staging de Multer: el archivo aterriza acá, `storage.put()`
      # lo sube a R2 y la ruta lo borra en el acto (`storage.driver === "s3"`).
      # Que el filesystem sea efímero dejó de importar — lo que persiste es el
      # objeto en R2, no esto.
      - key: UPLOAD_DIR
        value: /tmp/uploads
      # El tope de tamaño por archivo (50 MB) y de archivos por subida (10) ya NO
      # son variables: viven en `packages/shared` (`EVIDENCE_MAX_FILE_MB`,
      # `EVIDENCE_MAX_FILES`) y los importan la API y el front — un solo lugar
      # (SPEC-218).
      # ── Evidencia en Cloudflare R2 (D-011) ─────────────────────────────────
      # El MISMO driver que se prueba contra MinIO en local: cambian variables,
      # no el código (`apps/api/src/lib/storage.ts`). Con `s3` el SHA-256 se
      # calcula RELEYENDO el objeto subido, así que cubre los bytes que quedaron
      # guardados y no los del temporal — de eso cuelga la cadena de prueba.
      - key: STORAGE_DRIVER
        value: s3
      # `https://<ACCOUNT_ID>.r2.cloudflarestorage.com`. `sync: false` porque
      # lleva el ID de cuenta de Cloudflare adentro.
      - key: S3_ENDPOINT
        sync: false
      - key: S3_BUCKET
        value: propnexus-evidencia
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      # Las dos que siguen NO son redundantes: los defaults del código apuntan a
      # MinIO y R2 necesita lo contrario en las dos.
      #   · region: "When using the S3 API, the region for an R2 bucket is `auto`"
      #     — el default del código es us-east-1.
      #   · Cloudflare documenta virtual-hosted-style; path-style no está
      #     garantizado. El default del código es `true`, para MinIO.
      - key: S3_REGION
        value: auto
      - key: S3_FORCE_PATH_STYLE
        value: "false"
      # En R2 el bucket se crea a mano desde el dashboard (RUNBOOK §1.4). Que la
      # API no pueda crearlo es deliberado: sus credenciales son de objeto, no
      # de administración del bucket.
      - key: S3_CREATE_BUCKET
        value: "false"
      # D-013: Preprod SIEMPRE. Mainnet está fuera del alcance de M3.
      # La lee `apps/api/src/lib/anchor.ts` y la valida el factory contra
      # `REDES_PERMITIDAS`, que no incluye mainnet: pedirla no es un error de
      # configuración, es imposible.
      - key: CARDANO_NETWORK
        value: Preprod
      # **El modo vive acá y no solo en el dashboard, y ese es el punto.** Las
      # variables declaradas con `value:` las gobierna el Blueprint: un re-sync
      # pisa cualquier cambio hecho a mano. Mientras esto decía `simulated`, ese
      # re-sync devolvía la API al simulador **en silencio** —sin romper nada y
      # sin log de error—, que es el camino por el que el 2026-08-27 llegó a
      # producción un `EVIDENCE_ANCHOR` `Confirmed` con un TXID que no existe en
      # Preprod. Con el modo real encendido sería peor: convivirían TXIDs reales
      # e inventados en la misma columna sin nada que los separe.
      - key: ANCHOR_MODE
        value: real
      # Los dos secretos del modo real. `sync: false` = se cargan a mano en el
      # dashboard y no viajan en el repo (regla 12).
      #
      # **Que falten no tira la API** (D-075): el puerto queda inhabilitado, el
      # motivo sale en el log de arranque y todo anclaje rechaza — nunca produce
      # un TXID. Por eso el orden entre cargarlos y pushear esto dejó de
      # importar; antes, sin ellos, el proceso no levantaba.
      #
      # `SERVICE_WALLET_PRIVATE_KEY` es la **clave de pago** en bech32, no la
      # seed de 24 palabras (D-078): una seed deriva el árbol HD entero y el
      # servicio solo necesita firmar con una clave. Menos autoridad en una
      # variable de entorno, misma capacidad de anclar.
      #
      # ⚠ **No se rota.** El admin del validador es el hash de esta clave;
      # reemplazarla deja inalcanzables los hilos ya anclados, sin ningún error
      # visible.
      - key: BLOCKFROST_API_KEY
        sync: false
      - key: SERVICE_WALLET_PRIVATE_KEY
        sync: false
      # Lista blanca de CORS (D-065). El web es estático y vive en otro origen;
      # sin esto el browser corta cada request con `Authorization`.
      # Mismo caso: la lista blanca compara contra el header `Origin`, que trae
      # esquema (`https://propnexus-web.onrender.com`). Acepta varios separados
      # por coma.
      - key: WEB_ORIGIN
        sync: false
      # ── Observabilidad (M3 §4 "error budgets" · monitoring) ────────────────
      # Las dos son opcionales de verdad: `instrumentation.ts` (precargado por
      # `--require` en el startCommand de arriba) queda apagado sin ellas, sin
      # tumbar el proceso — mismo criterio que D-075 con el AnchorPort. Se
      # cargan a mano en el dashboard cuando exista la cuenta de Sentry/Grafana
      # Cloud, nunca en el repo (regla 12).
      - key: SENTRY_DSN
        sync: false
      # Grafana Cloud da un endpoint OTLP propio por stack (con Basic Auth vía
      # header, ver .env.example) — no hace falta Render Pro ni su Metrics
      # Stream: el proceso exporta directo por HTTPS.
      - key: OTEL_EXPORTER_OTLP_ENDPOINT
        sync: false
      # Grafana Cloud exige auth: "Authorization=Basic <base64(instanceID:apiKey)>".
      # El SDK de OTel lee este env var solo, sin que `instrumentation.ts`
      # tenga que tocarlo (los exporters lo leen internamente).
      - key: OTEL_EXPORTER_OTLP_HEADERS
        sync: false

  # ── Web (SPA estático) ─────────────────────────────────────────────────────
  # D-065: dejó de ser un servicio Node con SSR. Como static site no se duerme,
  # no consume del presupuesto de 750 horas —que ahora es todo de la API— y se
  # sirve desde CDN. El precio es que vive en otro origen: de ahí
  # `VITE_API_ORIGIN` acá y la lista blanca de CORS del otro lado.
  - type: web
    name: propnexus-web
    runtime: static
    branch: main
    rootDir: .
    buildFilter:
      paths:
        - apps/web/**
        - packages/shared/**
        - pnpm-lock.yaml
        - pnpm-workspace.yaml
        - package.json
        - render.yaml
    # Mismo motivo que en `propnexus-api`: si el entorno del build trae
    # NODE_ENV=production (Render lo manda igual, sin que este Blueprint lo
    # declare), `pnpm install` saltea devDependencies —vite, typescript—
    # y este build también se cae sin ellas.
    buildCommand: >-
      corepack enable &&
      NODE_ENV=development pnpm install --frozen-lockfile &&
      pnpm --filter @plataforma/shared build &&
      pnpm --filter @plataforma/web build
    staticPublishPath: apps/web/dist
    # SPA: cualquier path lo resuelve el router del cliente.
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      # De BUILD TIME: cambiarla exige redeploy del web, no un restart.
      # `sync: false` y no `fromService` porque hace falta la URL **con
      # esquema** (`https://propnexus-api.onrender.com`) y `fromService` solo
      # devuelve el host. Se pega a mano una vez, en el dashboard.
      - key: VITE_API_ORIGIN
        sync: false
      # ── Observabilidad del cliente (opcional, M3 §4/§5) ────────────────────
      # De build time, igual que la de arriba: cambiarlas exige redeploy del
      # web. Apagadas hasta que el dueño cree las cuentas — ver .env.example.
      - key: VITE_SENTRY_DSN
        sync: false
      - key: VITE_POSTHOG_KEY
        sync: false
      - key: VITE_POSTHOG_HOST
        sync: false
