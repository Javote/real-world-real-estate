name: CI

# `paths` espeja la regla de `CLAUDE.md` §Commits y ramas: CI corre si el push
# toca código. Un push donde todo archivo es `.md`, imagen, `.pdf`, `.csv`,
# `.log` o `.txt` no dispara nada, igual que `verify:all` no corre local. Es
# todo-o-nada: un solo archivo fuera de esas extensiones y corre entero. Lo que
# está bajo `docs/` corre siempre (re-incluido al final, el orden importa):
# `pnpm testids` lee un `.md` de ahí.
on:
  pull_request:
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.[pP][dD][fF]'
      - '!**/*.[pP][nN][gG]'
      - '!**/*.[jJ][pP][gG]'
      - '!**/*.[jJ][pP][eE][gG]'
      - '!**/*.[gG][iI][fF]'
      - '!**/*.[wW][eE][bB][pP]'
      - '!**/*.[iI][cC][oO]'
      - '!**/*.[cC][sS][vV]'
      - '!**/*.log'
      - '!**/*.txt'
      - '!**/*.[mM][pP]4'
      - '!**/*.[mM][oO][vV]'
      - '!**/*.[wW][eE][bB][mM]'
      - '!**/*.[sS][rR][tT]'
      - '!**/*.[vV][tT][tT]'
      - 'docs/**'
  push:
    branches: [main]
    paths:
      - '**'
      - '!**/*.md'
      - '!**/*.[pP][dD][fF]'
      - '!**/*.[pP][nN][gG]'
      - '!**/*.[jJ][pP][gG]'
      - '!**/*.[jJ][pP][eE][gG]'
      - '!**/*.[gG][iI][fF]'
      - '!**/*.[wW][eE][bB][pP]'
      - '!**/*.[iI][cC][oO]'
      - '!**/*.[cC][sS][vV]'
      - '!**/*.log'
      - '!**/*.txt'
      - '!**/*.[mM][pP]4'
      - '!**/*.[mM][oO][vV]'
      - '!**/*.[wW][eE][bB][mM]'
      - '!**/*.[sS][rR][tT]'
      - '!**/*.[vV][tT][tT]'
      - 'docs/**'

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

# **Un job por cosa, todos en paralelo y todos bloqueantes.** Render despliega
# solo si pasan todos los checks del commit (`autoDeployTrigger: checksPass`,
# RUNBOOK §2), así que el deploy espera al job más lento: cada uno corre en su
# propio runner y arranca apenas puede. El repo es público —minutos sin límite,
# 4 vCPU por runner, 20 jobs simultáneos—, así que un job más no cuesta nada.
# Antes era un solo job en fila, y `pnpm -r test:coverage` hacía esperar a la
# API (1:25) a que terminara web (2:13) sin depender de ella.
#
# TypeScript y Aiken siguen siendo dos cadenas de herramientas distintas, con
# sus versiones, sus artefactos y sus modos de falla: ninguno espera al otro.
# El equivalente local es `pnpm verify:all`. El plan y sus números están en
# `specs/README.md` §Lo que sigue.
jobs:
  lint:
    name: Lint + formato (Biome) + test IDs
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/preparar

      - name: Lint + formato (Biome)
        run: pnpm lint

      # La vara de aceptación de M3 se mide en test IDs del backlog, no en
      # líneas (M2-D5 §8). Falla si alguien reclama un ID que el entregable no
      # declara —un typo se ve implementado y no cuenta para nada— o si la
      # cobertura baja del piso. Ver SPEC-015 §3.
      - name: Trazabilidad de los test IDs del backlog
        run: pnpm testids

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/preparar
      - run: pnpm typecheck

  # Un job por paquete, cada uno contra su propio umbral de coverage
  # (`vitest.config.ts`/`.mts`). `@plataforma/shared` exporta desde `dist/`:
  # web y cardano lo importan compilado, así que se compila antes.
  test-web:
    name: Tests + coverage (web)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/preparar
      - run: pnpm --filter @plataforma/shared build
      - run: pnpm --filter @plataforma/web test:coverage

  test-api:
    name: Tests + coverage (api)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/preparar
      - run: pnpm --filter @plataforma/shared build
      - run: pnpm --filter @plataforma/api test:coverage

  test-packages:
    name: Tests + coverage (shared + cardano)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/preparar
      - run: pnpm --filter @plataforma/shared build
      - run: pnpm --filter @plataforma/shared --filter @plataforma/cardano test:coverage

  build:
    name: Build (web + api) + arranque compilado
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/preparar

      - name: Build (web + api)
        run: pnpm build

      # Ningún otro paso corre el `startCommand` real de `render.yaml`: los
      # tests importan `app.ts` directo (sin pasar por `--import`) y `tsc` no
      # ve lo que se resuelve recién al cargar un paquete — así pasaron dos
      # incidentes de deploy seguidos (2026-09-07: `--require` sin `./` no
      # resuelve igual que un script posicional; 2026-09-08:
      # `@opentelemetry/api` resolvía como transitiva en local pero no en una
      # instalación limpia). Este paso reproduce el comando exacto contra el
      # build recién compilado, con SENTRY_DSN/OTEL_EXPORTER_OTLP_ENDPOINT
      # puestas (con valores basura, sin red real) para que los mismos
      # `import()` tardíos de OpenTelemetry corran acá también.
      - name: Smoke test del arranque compilado (startCommand real)
        run: |
          node apps/api/dist/src/db/migrate.js
          NODE_ENV=production node --import ./apps/api/dist/src/instrumentation.js apps/api/dist/src/server.js > api-smoke.log 2>&1 &
          pid=$!
          ok=""
          for i in $(seq 1 20); do
            grep -q "API listening" api-smoke.log && { ok=1; break; }
            kill -0 "$pid" 2>/dev/null || break
            sleep 1
          done
          kill "$pid" 2>/dev/null || true
          wait "$pid" 2>/dev/null || true
          echo "── log del arranque ──"
          cat api-smoke.log
          if [ -z "$ok" ]; then
            echo "::error::la API no llegó a 'API listening' corriendo el startCommand real"
            exit 1
          fi
        env:
          DATABASE_URL: file:./.data/smoke.db
          JWT_SECRET: ci-smoke-secret-jamas-en-produccion
          SENTRY_DSN: https://smoke@o0.ingest.sentry.io/1
          OTEL_EXPORTER_OTLP_ENDPOINT: http://localhost:4318

  # M3 §4 pide "dependency scans" además de static analysis. **Dos pasos, a
  # propósito, no uno.** El primero nunca falla: es la visibilidad completa
  # (lo que el security review ya trió como "alto/moderado, no explotable en
  # runtime", todo en la cadena de vite/vitest/@babel de build y test) para que
  # quede en el log sin bloquear en algo ya decidido. El segundo es el gate
  # real: falla en **crítico** — si una dependencia nueva trae uno, esto se
  # entera antes que un humano leyendo el log a mano.
  # **`--ignore-registry-errors`**: un registry caído no tiene que tumbar el
  # build por algo que no es del código.
  # Sin `pnpm install`: `pnpm audit` lee el lockfile.
  audit:
    name: Dependency scan (pnpm audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: pnpm/action-setup@0977fd99725f1db4007ccb2928dbb4e90d06cc86 # v6
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: 22

      - name: Dependency scan — reporte completo (nunca bloquea)
        run: pnpm audit --ignore-registry-errors || true

      - name: Dependency scan — gate en crítico
        run: pnpm audit --audit-level critical --ignore-registry-errors

  # ── E2E ────────────────────────────────────────────────────────────────────
  #
  # **Bloquea** (dueño, 2026-10-06; era la pregunta abierta de SPEC-015). Un
  # shard es otro runner con su propio SQLite sembrado y su propia API y web:
  # los specs que escriben datos no se pisan entre shards, sin tocar ningún
  # test. Adentro, 1 worker y sin reintentos (`playwright.config.ts`):
  # Playwright recomienda 1 worker en CI, y con `checksPass` un test inestable
  # frena un deploy. `fail-fast: false` para ver las fallas de todos.
  #
  # Cuatro y no tres: el e2e es el job más lento y el deploy lo espera.
  # Playwright reparte archivo por archivo, así que un quinto no baja el más
  # cargado (76 s de tests, un grupo que no se parte).
  #
  # `a11y.spec.ts` no va acá: tiene su job, que no bloquea (SPEC-112).
  e2e:
    name: E2E Playwright (shard ${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    # Un shard tarda ~2 min. Sin tope, un paso colgado espera las 6 h del default y frena el deploy.
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/preparar

      # Solo chromium: los dos proyectos (mobile y desktop) lo usan — el
      # perfil iPhone 13 da el viewport, no el motor.
      - uses: ./.github/actions/playwright

      # La suite corre sobre lo que se publica, no sobre `pnpm dev` (`E2E_BUILD`).
      - name: Build (web + api)
        run: pnpm build

      # Los specs entran con los usuarios del seed, así que la base tiene que
      # existir y estar sembrada antes de levantar nada.
      - name: Base migrada y sembrada
        run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: file:./.data/dev.db
          JWT_SECRET: ci-secret-jamas-en-produccion

      - name: E2E
        run: pnpm --filter @plataforma/web e2e --grep-invert 'a11y\.spec' --shard=${{ matrix.shard }}/4
        env:
          DATABASE_URL: file:./.data/dev.db
          JWT_SECRET: ci-secret-jamas-en-produccion
          # El default (20) no alcanza: la suite hace ~10 logins por proyecto y
          # son dos, así que el segundo recibía 429 en todo. Ver el comentario
          # de `playwright.config.ts`.
          LOGIN_RATE_LIMIT_MAX: "100000"
          E2E_BUILD: "1"

      # Trace, video y captura de lo que falla, más el reporte. `.artifacts`
      # empieza con punto, y `upload-artifact` ≥ 4.4 ignora los directorios
      # ocultos si no se le pide: sin `include-hidden-files` el paso queda
      # verde sin subir nada.
      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts-${{ matrix.shard }}
          path: apps/web/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 14

  # axe en el navegador real (`a11y.spec.ts`). **No bloquea** (SPEC-112: ninguna
  # capa de accesibilidad bloquea todavía): el `continue-on-error` va en el
  # paso y no en el job, porque Render mira el check del job, y un job con
  # `continue-on-error` igual publica su check en `failure`. Una violación
  # nueva queda marcada en el paso; la conocida se registra en
  # `a11y/hallazgos.ts`, no se silencia.
  e2e-a11y:
    name: E2E accesibilidad (no bloquea, SPEC-112)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: ./.github/actions/preparar

      - uses: ./.github/actions/playwright

      # La suite corre sobre lo que se publica, no sobre `pnpm dev` (`E2E_BUILD`).
      - name: Build (web + api)
        run: pnpm build

      - name: Base migrada y sembrada
        run: pnpm db:migrate && pnpm db:seed
        env:
          DATABASE_URL: file:./.data/dev.db
          JWT_SECRET: ci-secret-jamas-en-produccion

      - name: E2E a11y
        continue-on-error: true
        run: pnpm --filter @plataforma/web e2e --grep 'a11y\.spec'
        env:
          DATABASE_URL: file:./.data/dev.db
          JWT_SECRET: ci-secret-jamas-en-produccion
          LOGIN_RATE_LIMIT_MAX: "100000"
          E2E_BUILD: "1"

      - name: Subir artefactos
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: e2e-artifacts-a11y
          path: apps/web/e2e/.artifacts/
          include-hidden-files: true
          retention-days: 14

  contracts:
    name: Contratos Aiken (fmt + check + blueprint al día)
    # Espeja `pnpm contracts:verify`, más el chequeo de que el blueprint
    # commiteado esté al día — que solo tiene sentido acá, contra un árbol limpio.
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - uses: aiken-lang/setup-aiken@1728a4be43be099752e22d8b841706caaa6fdd88 # v1
        with:
          version: v1.1.21   # misma versión pineada que usa el equipo

      - run: aiken fmt --check

      - run: aiken check

      - name: aiken build (blueprint reproducible)
        run: aiken build

      - name: Verificar que plutus.json commiteado está al día
        run: git diff --exit-code plutus.json || (echo "::error::plutus.json desactualizado — corré 'aiken build' y commiteá" && exit 1)

  # ── Análisis estático de seguridad ───────────────────────────────────────
  #
  # M3 §4 pide "static analysis" además de dependency scans (que corre en el
  # job `app`, arriba). Job propio, en paralelo con los otros tres — mismo
  # criterio que TS/Aiken: nada de esto depende de que compile o pase el
  # resto.
  #
  # `p/security-audit` + `p/owasp-top-ten` son los rulesets públicos de
  # Semgrep, mantenidos por ellos — no hay reglas propias que mantener acá.
  # El CLI es gratis y sin cuenta (a diferencia de su plataforma SaaS, que no
  # hace falta: el job falla solo con el exit code).
  #
  # Tres reglas de *hardening* de supply-chain quedan excluidas a propósito,
  # no ignoradas por comodidad:
  #   - las tres de pnpm (`blockExoticSubdeps`, `minimumReleaseAge`,
  #     `trustPolicy`) piden pnpm 10.16+/10.21+/10.26+, y el repo está
  #     pineado a pnpm@9.15.0 (ver "El pin pnpm@9.15.0" en CLAUDE.md raíz).
  #     Agregarlas hoy sería la MISMA trampa que ya mordió una vez con
  #     `pnpm.overrides`: un setting que el pnpm real no lee, en silencio.
  #   - la de npm (`min-release-age` en `.npmrc`) es de npm, no de pnpm — el
  #     repo no instala con npm, así que su aplicabilidad no está confirmada.
  # Las tres quedan para cuando se suba el pin de pnpm (ver la trampa en
  # CLAUDE.md), no se resuelven acá.
  security:
    name: Static analysis (Semgrep)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Instalar Semgrep
        run: pip install semgrep

      - name: Semgrep (security-audit + owasp-top-ten)
        run: |
          semgrep scan \
            --config=p/security-audit \
            --config=p/owasp-top-ten \
            --exclude-rule package_managers.pnpm.pnpm-block-exotic-sub-dependencies.pnpm-block-exotic-sub-dependencies \
            --exclude-rule package_managers.pnpm.pnpm-missing-minimum-release-age.pnpm-minimum-release-age \
            --exclude-rule package_managers.pnpm.pnpm-trust-policy.pnpm-trust-policy \
            --exclude-rule package_managers.npm.npm-missing-minimum-release-age.npm-missing-minimum-release-age \
            --exclude contracts/build \
            --exclude specs/evidencia-m3/2-api/postman \
            --exclude apps/api/api-docs/propnexus.postman_collection.json \
            --error
