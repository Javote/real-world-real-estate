name: CI

on:
  pull_request:
  push:
    branches: [main, 'track/**']

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  gate:
    name: La puerta (scripts/gate.sh --ci)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # la puerta compara contra la base del cambio

      - uses: pnpm/action-setup@v4
        # toma la versión de "packageManager" del package.json raíz

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Instalar dependencias
        run: pnpm install --frozen-lockfile

      # Un solo paso, el mismo script que corre el hook de push en local.
      # Si CI y local se separan, divergen — ver D-032.
      - name: Puerta
        run: scripts/gate.sh --ci

  contracts:
    name: Contratos Aiken (fmt + check + blueprint al día)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4

      - uses: aiken-lang/setup-aiken@v1
        with:
          version: v1.1.21   # misma versión pineada que usa el equipo

      - run: aiken fmt --check

      - run: aiken check

      - name: aiken build (blueprint reproducible)
        run: aiken build

      - name: Verificar que plutus.json commiteado está al día
        run: git diff --exit-code plutus.json || (echo "::error::plutus.json desactualizado — corré 'aiken build' y commiteá" && exit 1)
