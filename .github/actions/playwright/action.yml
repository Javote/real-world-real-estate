name: Navegador de Playwright
description: Chromium (solo el headless shell) desde la caché, con la versión de Playwright en la llave, y sin apt.

# Sin `--with-deps` ni `install-deps`: las librerías que pide el headless shell ya vienen en la
# imagen de `ubuntu-latest` (en un runner sano, `install-deps` solo sumaba fuentes CJK y mesa). Y apt
# depende del mirror del runner: el 2026-10-07 dos shards no llegaron a `azure.archive.ubuntu.com`,
# cayeron a `archive.ubuntu.com` y la descarga de las listas se colgó sin timeout. Si a la imagen le
# llega a faltar una librería, Playwright falla al lanzar el navegador con la lista de lo que falta.

runs:
  using: composite
  steps:
    - name: Versión de Playwright
      id: version
      shell: bash
      run: echo "version=$(pnpm --filter @plataforma/web exec playwright --version | awk '{print $2}')" >> "$GITHUB_OUTPUT"

    # La llave cambia con la versión de Playwright, que fija la de chromium: subir una baja otra.
    - name: Caché de los navegadores
      id: cache
      uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6
      with:
        path: ~/.cache/ms-playwright
        key: playwright-${{ runner.os }}-${{ steps.version.outputs.version }}-shell

    # `--only-shell`: los tests corren headless, que usa el headless shell; el Chrome completo no
    # lo abre nadie. ffmpeg (el video) viene igual.
    - name: Chromium
      if: steps.cache.outputs.cache-hit != 'true'
      shell: bash
      run: pnpm --filter @plataforma/web exec playwright install --only-shell chromium
