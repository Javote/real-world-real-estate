<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#6D4AFF" />
    <!-- PWA (D-065, SPEC-222): el manifest y los íconos salen de public/; el
         service worker lo registra src/lib/pwa.ts, solo en producción. -->
    <link rel="manifest" href="/manifest.json" />
    <link rel="icon" href="/icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-icon.png" />
    <title>PropNexus</title>
  </head>
  <body>
    <!-- SPA: sin SSR (D-065). El documento lo sirve un static site; el router
         vive entero en el cliente. -->
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
